# Application alert rules for the task-app.
# Picked up by the prometheus-operator via the `release: prometheus` label
# (matches the kube-prometheus-stack release name in helmfile.yaml).
#
#   kubectl apply -f observability/alerts/task-app.yaml
#   # verify it loaded:  :9090/rules  (port-forward prometheus)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: task-app-alerts
  namespace: observability
  labels:
    release: prometheus
    role: alert-rules
spec:
  groups:
    - name: task-app.rules
      rules:

        # High Error Rate Alert
        - alert: HighErrorRate
          expr: |
            (
              rate(http_requests_total{status=~"5.."}[5m]) /
              rate(http_requests_total[5m])
            ) * 100 > 5
          for: 2m
          labels:
            severity: warning
            service: task-app
          annotations:
            summary: "High error rate detected"
            description: "Error rate is {{ $value }}% for the last 5 minutes"

        # Application Down Alert
        - alert: ApplicationDown
          expr: up{job="task-app"} == 0
          for: 1m
          labels:
            severity: critical
            service: task-app
          annotations:
            summary: "Application is down"
            description: "Task application has been down for more than 1 minute"

        # High Response Time Alert
        - alert: HighResponseTime
          expr: |
            (
              rate(http_request_duration_seconds_sum[5m]) /
              rate(http_request_duration_seconds_count[5m])
            ) > 1
          for: 5m
          labels:
            severity: warning
            service: task-app
          annotations:
            summary: "High response time detected"
            description: "Average response time is {{ $value }}s for the last 5 minutes"

        # High Memory Usage Alert
        - alert: HighMemoryUsage
          expr: |
            (
              container_memory_working_set_bytes{pod=~"task-app.*"} /
              container_spec_memory_limit_bytes{pod=~"task-app.*"}
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
            service: task-app
          annotations:
            summary: "High memory usage detected"
            description: "Memory usage is {{ $value }}% for pod {{ $labels.pod }}"

        # Pod Restart Alert
        - alert: PodRestarting
          expr: rate(kube_pod_container_status_restarts_total{pod=~"task-app.*"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
            service: task-app
          annotations:
            summary: "Pod is restarting frequently"
            description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 5 minutes"
