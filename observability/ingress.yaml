apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obs-server
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: obs.task.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: obs-server
                port:
                  number: 80