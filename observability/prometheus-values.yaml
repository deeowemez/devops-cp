# Release:    prometheus
# Chart:      grafana/kube-prometheus-stack
# Version:    86.1.0         # app version v0.91.0 (prometheus-operator)
# Namespace:  observability

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi
prometheus:
  prometheusSpec:
    resources:
      limits:
        memory: 400Mi
      requests:
        memory: 200Mi
    retention: 1d
