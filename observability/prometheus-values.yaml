# Release:    prometheus
# Chart:      grafana/kube-prometheus-stack
# Version:    86.1.0         # app version v0.91.0 (prometheus-operator)
# Namespace:  observability

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 256Mi
prometheus:
  prometheusSpec:
    resources:
      limits:
        memory: 400Mi
      requests:
        memory: 200Mi
    retention: 1d

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-slack
  config:
    global:
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
    route:
      receiver: slack
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      routes:
        - matchers: ['alertname = "Watchdog"']
          receiver: "null"
    receivers:
      - name: slack
        slack_configs:
          - channel: '#alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              _severity:_ {{ .Labels.severity }}
              {{ end }}
      - name: "null"
