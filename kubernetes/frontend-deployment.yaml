apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: app-frontend:latest
        imagePullPolicy: Never
        ports: 
        - containerPort: 80
          name: frontend
        env:
        - name: REACT_APP_API_URL
          value: "/api"

