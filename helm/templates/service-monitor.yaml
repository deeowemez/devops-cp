apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: "{{ .Values.backend.name }}-metrics"
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.backend.name }}
    release: prometheus
spec:
  selector:
    matchLabels:
      app: {{ .Values.backend.name }}
  endpoints:
  - port: http
    path: /api/metrics
    interval: 15s