apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-app
  namespace: argocd
spec:
  project: default

  # Git source
  source:
    repoURL: git@gitlab.com:deeowemez/task-app.git
    targetRevision: HEAD
    path: helm/
    helm:
      valueFiles:
        - values.yaml

  # Destination Kubernetes cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: task-app

  # Auto-sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
